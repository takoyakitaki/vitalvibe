<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VitalVibe – เข้าสู่ระบบ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Prompt', sans-serif; }
    body { background: #0d1117; }
    .card-glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-primary {
      background: linear-gradient(135deg, #14b8a6, #10b981);
      transition: all .2s;
    }
    .btn-primary:active { transform: scale(0.97); opacity: .9; }
    input:focus { outline: none; border-color: #14b8a6; }
    .tab-active { background: linear-gradient(135deg,#14b8a6,#10b981); color:#fff; }
    .tab-inactive { color: rgba(255,255,255,.5); }
    @keyframes floatUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
    .float-up { animation: floatUp .5s ease-out forwards; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Background blobs -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full opacity-20" style="background:radial-gradient(circle,#14b8a6,transparent)"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 rounded-full opacity-20" style="background:radial-gradient(circle,#10b981,transparent)"></div>
  </div>

  <div class="w-full max-w-sm float-up">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="w-20 h-20 mx-auto rounded-3xl flex items-center justify-center text-4xl mb-3 shadow-2xl"
           style="background:linear-gradient(135deg,#14b8a6,#10b981)">💚</div>
      <h1 class="text-3xl font-black text-white tracking-tight">VitalVibe</h1>
      <p class="text-sm text-teal-400 font-semibold mt-1">สุขภาพดีเริ่มต้นที่นี่</p>
    </div>

    <!-- Card -->
    <div class="card-glass rounded-3xl p-6">

      <!-- Tabs -->
      <div class="flex bg-white/10 rounded-2xl p-1 mb-6">
        <button id="tabLogin" onclick="switchTab('login')"
          class="flex-1 py-2.5 rounded-xl text-sm font-bold tab-active transition-all">
          เข้าสู่ระบบ
        </button>
        <button id="tabRegister" onclick="switchTab('register')"
          class="flex-1 py-2.5 rounded-xl text-sm font-bold tab-inactive transition-all">
          สมัครสมาชิก
        </button>
      </div>

      <!-- Login Form -->
      <div id="formLogin">
        <div class="space-y-3">
          <input id="loginEmail" type="email" placeholder="อีเมล"
            class="w-full bg-white/10 border border-white/20 rounded-2xl px-4 py-3 text-white placeholder-white/40 text-sm transition-colors">
          <div class="relative">
            <input id="loginPassword" type="password" placeholder="รหัสผ่าน"
              class="w-full bg-white/10 border border-white/20 rounded-2xl px-4 py-3 text-white placeholder-white/40 text-sm transition-colors pr-12">
            <button onclick="togglePass('loginPassword')" class="absolute right-4 top-3.5 text-white/40 text-lg">👁</button>
          </div>
        </div>
        <button id="btnLogin"
          class="btn-primary w-full mt-5 py-3.5 rounded-2xl text-white font-black text-sm shadow-lg">
          เข้าสู่ระบบ
        </button>
      </div>

      <!-- Register Form -->
      <div id="formRegister" class="hidden">
        <div class="space-y-3">
          <input id="regName" type="text" placeholder="ชื่อที่แสดง"
            class="w-full bg-white/10 border border-white/20 rounded-2xl px-4 py-3 text-white placeholder-white/40 text-sm transition-colors">
          <input id="regEmail" type="email" placeholder="อีเมล"
            class="w-full bg-white/10 border border-white/20 rounded-2xl px-4 py-3 text-white placeholder-white/40 text-sm transition-colors">
          <div class="relative">
            <input id="regPassword" type="password" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัว)"
              class="w-full bg-white/10 border border-white/20 rounded-2xl px-4 py-3 text-white placeholder-white/40 text-sm transition-colors pr-12">
            <button onclick="togglePass('regPassword')" class="absolute right-4 top-3.5 text-white/40 text-lg">👁</button>
          </div>
        </div>
        <button id="btnRegister"
          class="btn-primary w-full mt-5 py-3.5 rounded-2xl text-white font-black text-sm shadow-lg">
          สมัครสมาชิก
        </button>
      </div>

      <!-- Error / Status -->
      <div id="msgBox" class="hidden mt-4 p-3 rounded-2xl text-sm text-center font-semibold"></div>

    </div>

    <!-- Footer note -->
    <p class="text-center text-white/30 text-xs mt-6">
      ระบบล็อกอินสำหรับ LINE OA · VitalVibe
    </p>
  </div>

  <script>
    // Define global functions BEFORE module loads (so onclick handlers work)
    window.switchTab = (tab) => {
      document.getElementById('formLogin').classList.toggle('hidden',    tab !== 'login');
      document.getElementById('formRegister').classList.toggle('hidden', tab !== 'register');
      document.getElementById('tabLogin').className    = `flex-1 py-2.5 rounded-xl text-sm font-bold transition-all ${tab==='login'    ? 'tab-active':'tab-inactive'}`;
      document.getElementById('tabRegister').className = `flex-1 py-2.5 rounded-xl text-sm font-bold transition-all ${tab==='register' ? 'tab-active':'tab-inactive'}`;
      hideMsg();
    };

    window.togglePass = (id) => {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    };

    function showMsg(text, ok = false) {
      const el = document.getElementById('msgBox');
      el.textContent = text;
      el.className = `mt-4 p-3 rounded-2xl text-sm text-center font-semibold ${ok ? 'bg-teal-500/20 text-teal-300' : 'bg-red-500/20 text-red-300'}`;
      el.classList.remove('hidden');
    }
    function hideMsg() { document.getElementById('msgBox').classList.add('hidden'); }
    window.showMsg = showMsg;
    window.hideMsg = hideMsg;
  </script>

  <script type="module">
    import { auth, db } from './lib/firebase.js';
    import { saveSession } from './lib/auth.js';
    import {
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      updateProfile,
    } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import { doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    // Grab redirect target from query string
    const params   = new URLSearchParams(window.location.search);
    const requestedRedirect = params.get('redirect') || '/pages/food.html';
    const redirect = requestedRedirect.startsWith('/') && !requestedRedirect.startsWith('//')
      ? requestedRedirect
      : '/pages/food.html';

    async function persistUser(user, displayName = '') {
      // Upsert user doc in Firestore
      const ref = doc(db, 'users', user.uid);
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, {
          uid:         user.uid,
          displayName: displayName || user.displayName || 'ผู้ใช้',
          email:       user.email,
          avatar:      '',
          points:      0,
          wallet:      0,
          createdAt:   new Date().toISOString(),
        });
      }
      const data = snap.exists() ? snap.data() : { displayName, avatar: '', points: 0 };
      saveSession({
        uid:         user.uid,
        displayName: data.displayName || displayName,
        avatar:      data.avatar || '',
      });
    }
    

    window.handleLogin = async () => {
      const email = document.getElementById('loginEmail').value.trim();
      const pass  = document.getElementById('loginPassword').value;
      if (!email || !pass) return showMsg('กรุณากรอกข้อมูลให้ครบ');
      try {
        showMsg('กำลังเข้าสู่ระบบ…', true);
        const cred = await signInWithEmailAndPassword(auth, email, pass);
        await persistUser(cred.user, '');
        window.location.href = redirect;
      } catch (e) {
        const msgs = {
          'auth/user-not-found':  'ไม่พบบัญชีนี้',
          'auth/wrong-password':  'รหัสผ่านไม่ถูกต้อง',
          'auth/invalid-email':   'อีเมลไม่ถูกต้อง',
          'auth/too-many-requests': 'ลองใหม่ภายหลัง (ลองเกินกำหนด)',
        };
        showMsg(msgs[e.code] || e.message);
      }
    };

    window.handleRegister = async () => {
      const name  = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const pass  = document.getElementById('regPassword').value;
      if (!name || !email || !pass) return showMsg('กรุณากรอกข้อมูลให้ครบ');
      if (pass.length < 6)          return showMsg('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
      try {
        showMsg('กำลังสมัครสมาชิก…', true);
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(cred.user, { displayName: name });
        await persistUser(cred.user, name);
        window.location.href = redirect;
      } catch (e) {
        const msgs = {
          'auth/email-already-in-use': 'อีเมลนี้ถูกใช้แล้ว',
          'auth/invalid-email':        'อีเมลไม่ถูกต้อง',
          'auth/weak-password':        'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร',
        };
        showMsg(msgs[e.code] || e.message);
      }
    };

    // Attach event listeners after module loads
    document.getElementById('btnLogin').addEventListener('click', window.handleLogin);
    document.getElementById('btnRegister').addEventListener('click', window.handleRegister);
  </script>
</body>
</html>
